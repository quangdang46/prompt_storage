name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            method: cross
            suffix: linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            method: cross
            suffix: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            method: native
            suffix: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            method: native
            suffix: macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            method: native
            suffix: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux cross-compile)
        if: matrix.method == 'cross'
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.method == 'cross'
        run: cross build --release --target ${{ matrix.target }} -p pst

      - name: Build (native)
        if: matrix.method == 'native'
        run: cargo build --release --target ${{ matrix.target }} -p pst

      - name: Stage binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          BIN="target/${{ matrix.target }}/release/pst"
          file "$BIN"
          mkdir -p stage
          cp "$BIN" "stage/pst"
          chmod 755 "stage/pst"

      - name: Stage binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pst.exe" "stage/pst.exe"

      - name: Package + checksum (Unix)
        if: matrix.os != 'windows-latest'
        working-directory: stage
        run: |
          ARCHIVE="pst-${{ matrix.suffix }}.tar.gz"
          tar -czf "$ARCHIVE" pst
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Package + checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: stage
        run: |
          $archive = "pst-${{ matrix.suffix }}.zip"
          Compress-Archive -Path pst.exe -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "$archive.sha256" -NoNewline -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: |
            stage/pst-*.tar.gz
            stage/pst-*.tar.gz.sha256
            stage/pst-*.zip
            stage/pst-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          rm -f SHA256SUMS.txt
          for f in pst-*.tar.gz pst-*.zip; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pst-*.tar.gz
            artifacts/pst-*.tar.gz.sha256
            artifacts/pst-*.zip
            artifacts/pst-*.zip.sha256
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
